name: Plum CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-cov ruff pyright

      - name: Lint (ruff)
        run: ruff check app/ --select=E,F,W --ignore=E501

      - name: Type check (pyright)
        run: |
          pyright --version
          pyright app/ --ignoreexternal || true

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
